name: 功能建议
description: 描述希望完成的任务和目前的阻碍。
title: "[建议] "
body:
  - type: textarea
    id: task
    attributes:
      label: 想完成什么任务
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: 当前能力缺口与验收方式
      description: 可说明现有服务、公开接口文档和期望结果，勿填写密钥。
    validations:
      required: true
